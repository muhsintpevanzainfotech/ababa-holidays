<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="weddingBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="goldRings" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="30%" stop-color="#FBBF24"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#881337" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#weddingBg)" filter="url(#shadow)"/>

  <!-- Romantic Sparkles & Swirls Background Pattern -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>
  
  <!-- Subtle Heart Aura Background -->
  <path d="M 256 120 C 230 70 140 70 140 160 C 140 240 256 310 256 310 C 256 310 372 240 372 160 C 372 70 282 70 256 120 Z" fill="#FFFFFF" fill-opacity="0.08"/>

  <!-- Romantic Floating Sparkles -->
  <g fill="#FEF08A">
    <path d="M 120 160 Q 120 180 100 180 Q 120 180 120 200 Q 120 180 140 180 Q 120 180 120 160" />
    <path d="M 390 150 Q 390 170 370 170 Q 390 170 390 190 Q 390 170 410 170 Q 390 170 390 150" />
    <path d="M 370 340 Q 370 355 355 355 Q 370 355 370 370 Q 370 355 385 355 Q 370 355 370 340" />
    <path d="M 140 330 Q 140 345 125 345 Q 140 345 140 360 Q 140 345 155 345 Q 140 345 140 330" />
    <circle cx="256" cy="75" r="4"/>
    <circle cx="330" cy="100" r="3"/>
    <circle cx="180" cy="110" r="3"/>
  </g>

  <!-- Central Wedding & Honeymoon Element -->
  <g transform="translate(0, 10)">
    
    <!-- Left Ring (Gold Band) -->
    <ellipse cx="205" cy="245" rx="72" ry="72" fill="none" stroke="url(#goldRings)" stroke-width="24" filter="drop-shadow(0 8px 12px rgba(0,0,0,0.15))"/>
    
    <!-- Right Ring (Diamond Solitaire Band) -->
    <ellipse cx="295" cy="245" rx="72" ry="72" fill="none" stroke="url(#goldRings)" stroke-width="24" filter="drop-shadow(0 8px 12px rgba(0,0,0,0.15))"/>

    <!-- Intertwine Overlay Arc for Realistic Depth -->
    <path d="M 235 190 A 72 72 0 0 1 270 235" fill="none" stroke="url(#goldRings)" stroke-width="24" stroke-linecap="round"/>

    <!-- Sparkling Diamond on Top Ring -->
    <g transform="translate(295, 145)">
      <!-- Diamond Crown Setting -->
      <path d="M -16 12 L 0 28 L 16 12 L 10 -2 L -10 -2 Z" fill="#D97706"/>
      
      <!-- Diamond Gem Facets -->
      <polygon points="0,-28 -28,-6 0,22 28,-6" fill="url(#diamondGrad)"/>
      <polygon points="0,-28 -14,-6 0,22 14,-6" fill="#FFFFFF"/>
      <polygon points="-28,-6 -14,-6 0,22" fill="#BAE6FD"/>
      <polygon points="28,-6 14,-6 0,22" fill="#7DD3FC"/>
      <polygon points="0,-28 -28,-6 -14,-6" fill="#F0F9FF"/>
      <polygon points="0,-28 28,-6 14,-6" fill="#E0F2FE"/>

      <!-- Diamond Flash Sparkle -->
      <path d="M 0 -45 L 3 -33 L 15 -30 L 3 -27 L 0 -15 L -3 -27 L -15 -30 L -3 -33 Z" fill="#FFFFFF"/>
    </g>

    <!-- Honeymoon Car / Ribbon / Flowers Accent Banner at Bottom -->
    <g transform="translate(256, 360)">
      <!-- Ribbon Banner -->
      <path d="M -140 10 Q 0 -15 140 10 L 130 45 Q 0 20 -130 45 Z" fill="#FFFFFF"/>
      <path d="M -140 10 L -165 -5 L -160 30 L -130 45 Z" fill="#E2E8F0"/>
      <path d="M 140 10 L 165 -5 L 160 30 L 130 45 Z" fill="#E2E8F0"/>

      <!-- Heart Badge in Center of Ribbon -->
      <circle cx="0" cy="18" r="22" fill="#F43F5E"/>
      <path d="M 0 12 C -4 6 -12 6 -12 14 C -12 21 0 26 0 26 C 0 26 12 21 12 14 C 12 6 4 6 0 12 Z" fill="#FFFFFF"/>

      <!-- Honeymoon Travel Wings on Banner -->
      <path d="M -90 18 Q -40 8 -15 16" stroke="#BE123C" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M 90 18 Q 40 8 15 16" stroke="#BE123C" stroke-width="3" stroke-linecap="round" fill="none"/>
    </g>
  </g>
</svg>
