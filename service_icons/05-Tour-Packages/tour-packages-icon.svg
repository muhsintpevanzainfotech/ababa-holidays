<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="tourBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="suitcaseBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4C1D95" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#tourBg)" filter="url(#shadow)"/>

  <!-- Compass Background Dial Lines -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>
  
  <!-- Airplane Flying Path Arc in Background -->
  <path d="M 80 340 C 120 180 320 120 430 110" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="10 10" stroke-opacity="0.6"/>
  
  <!-- Plane Silhouette -->
  <g transform="translate(425, 105) rotate(15)">
    <path d="M 0 -15 L 6 -5 L 25 0 L 6 5 L 4 18 L 0 15 L -2 18 L -3 5 L -18 2 L -5 -3 Z" fill="#FFFFFF"/>
  </g>

  <!-- Central Tour Luggage / Suitcase & Adventure Composition -->
  <g transform="translate(0, 10)">
    
    <!-- World Globe Behind Suitcase -->
    <g transform="translate(325, 190)">
      <circle cx="0" cy="0" r="65" fill="url(#globeGrad)" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.2))"/>
      <!-- Globe Latitude / Longitude lines -->
      <ellipse cx="0" cy="0" rx="35" ry="65" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.5"/>
      <line x1="-65" y1="0" x2="65" y2="0" stroke="#FFFFFF" stroke-width="3" opacity="0.5"/>
      <ellipse cx="0" cy="-30" rx="55" ry="20" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.4"/>
      <ellipse cx="0" cy="30" rx="55" ry="20" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.4"/>
      
      <!-- Continents Silhouette -->
      <path d="M -30 -20 Q -10 -45 20 -30 Q 40 -10 15 10 Q -5 30 -25 15 Z" fill="#22C55E" opacity="0.8"/>
    </g>

    <!-- Main Travel Suitcase -->
    <g transform="translate(180, 290)">
      <!-- Suitcase Wheels -->
      <circle cx="-65" cy="100" r="12" fill="#1E293B"/>
      <circle cx="65" cy="100" r="12" fill="#1E293B"/>
      <circle cx="-65" cy="100" r="6" fill="#94A3B8"/>
      <circle cx="65" cy="100" r="6" fill="#94A3B8"/>

      <!-- Telescopic Handle -->
      <path d="M -35 -140 L -35 -70 M 35 -140 L 35 -70" stroke="#64748B" stroke-width="8" stroke-linecap="round"/>
      <path d="M -45 -140 L 45 -140" stroke="#1E293B" stroke-width="14" stroke-linecap="round"/>

      <!-- Suitcase Main Case -->
      <rect x="-95" y="-70" width="190" height="165" rx="24" fill="url(#suitcaseBody)" filter="drop-shadow(0 12px 20px rgba(0,0,0,0.25))"/>
      
      <!-- Modern Ribbed Texture Lines -->
      <line x1="-70" y1="-30" x2="70" y2="-30" stroke="#B45309" stroke-width="4" stroke-linecap="round"/>
      <line x1="-70" y1="0" x2="70" y2="0" stroke="#B45309" stroke-width="4" stroke-linecap="round"/>
      <line x1="-70" y1="30" x2="70" y2="30" stroke="#B45309" stroke-width="4" stroke-linecap="round"/>
      <line x1="-70" y1="60" x2="70" y2="60" stroke="#B45309" stroke-width="4" stroke-linecap="round"/>

      <!-- Protective Corner Bumpers -->
      <path d="M -95 -45 A 24 24 0 0 1 -70 -70 L -70 -45 Z" fill="#78350F"/>
      <path d="M 95 -45 A 24 24 0 0 0 70 -70 L 70 -45 Z" fill="#78350F"/>
      <path d="M -95 70 A 24 24 0 0 0 -70 95 L -70 70 Z" fill="#78350F"/>
      <path d="M 95 70 A 24 24 0 0 1 70 95 L 70 70 Z" fill="#78350F"/>

      <!-- Straps & Metal Buckle Center -->
      <rect x="-7" y="-70" width="14" height="165" fill="#78350F"/>
      <rect x="-14" y="5" width="28" height="18" rx="4" fill="#FDE047"/>
      <rect x="-9" y="9" width="18" height="10" rx="2" fill="#78350F"/>

      <!-- Travel Stickers on Luggage -->
      <g transform="translate(-45, -20) rotate(-12)">
        <rect x="-22" y="-14" width="44" height="28" rx="6" fill="#EF4444"/>
        <circle cx="-10" cy="0" r="6" fill="#FFFFFF"/>
        <line x1="2" y1="-4" x2="16" y2="-4" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
        <line x1="2" y1="4" x2="12" y2="4" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      </g>

      <g transform="translate(45, 45) rotate(15)">
        <circle cx="0" cy="0" r="18" fill="#10B981"/>
        <path d="M -8 5 L 0 -8 L 8 5 Z" fill="#FFFFFF"/>
      </g>

      <!-- Luggage Tag -->
      <path d="M -50 -70 L -70 -105 L -55 -115 L -35 -80 Z" fill="#EC4899"/>
      <circle cx="-62" cy="-105" r="3" fill="#FFFFFF"/>
    </g>

    <!-- Camera & Passport Accent in Foreground -->
    <g transform="translate(100, 320) rotate(-15)">
      <!-- Passport -->
      <rect x="-25" y="-35" width="50" height="70" rx="6" fill="#1E3A8A"/>
      <circle cx="0" cy="-5" r="12" fill="none" stroke="#FBBF24" stroke-width="2"/>
      <line x1="-15" y1="18" x2="15" y2="18" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
</svg>
