<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="busBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="busBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="glassWindow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#064E3B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Circle with Soft Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#busBg)" filter="url(#shadow)"/>

  <!-- Compass / Road Lines Pattern in Background -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>
  
  <!-- Mountain Travel Scenery Silhouette in Background -->
  <path d="M 60 280 L 150 200 L 220 250 L 320 170 L 410 240 L 452 280 Z" fill="#FFFFFF" fill-opacity="0.15"/>

  <!-- Bus Group -->
  <g transform="translate(0, 15)">
    <!-- Road Base & Speed Accents -->
    <path d="M 70 380 L 442 380" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-opacity="0.8"/>
    <path d="M 120 400 L 392 400" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="16 16" stroke-opacity="0.4"/>

    <!-- Main Luxury Tourist Coach Body -->
    <path d="M 130 160 C 130 145 150 140 190 140 L 370 140 C 395 140 405 155 405 185 L 405 320 C 405 330 395 335 385 335 L 125 335 C 115 335 110 325 110 305 L 110 200 C 110 175 118 160 130 160 Z" fill="url(#busBody)"/>

    <!-- Dynamic Modern Livery Stripe -->
    <path d="M 110 270 Q 256 240 405 280 L 405 305 Q 256 265 110 295 Z" fill="url(#goldAccent)"/>
    <path d="M 110 298 Q 256 268 405 308 L 405 315 L 110 315 Z" fill="#047857"/>

    <!-- Large Panoramic Tourist Windows -->
    <!-- Driver Front Windshield -->
    <path d="M 345 155 L 390 165 C 395 168 398 175 398 185 L 398 230 L 345 230 Z" fill="url(#glassWindow)"/>
    <!-- Passenger Panoramic Windows -->
    <rect x="290" y="155" width="45" height="75" rx="6" fill="url(#glassWindow)"/>
    <rect x="235" y="155" width="45" height="75" rx="6" fill="url(#glassWindow)"/>
    <rect x="180" y="155" width="45" height="75" rx="6" fill="url(#glassWindow)"/>
    <path d="M 135 158 C 130 162 125 170 125 185 L 125 230 L 170 230 L 170 158 Z" fill="url(#glassWindow)"/>

    <!-- Passenger Silhouette Details inside Windows -->
    <circle cx="202" cy="185" r="7" fill="#FFFFFF" fill-opacity="0.6"/>
    <path d="M 190 205 Q 202 195 214 205" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-opacity="0.6"/>
    
    <circle cx="257" cy="185" r="7" fill="#FFFFFF" fill-opacity="0.6"/>
    <path d="M 245 205 Q 257 195 269 205" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-opacity="0.6"/>

    <circle cx="312" cy="185" r="7" fill="#FFFFFF" fill-opacity="0.6"/>
    <path d="M 300 205 Q 312 195 324 205" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-opacity="0.6"/>

    <!-- Front Luxury Grille & Headlights -->
    <path d="M 390 270 L 405 270 L 402 300 L 388 295 Z" fill="#E2E8F0"/>
    <circle cx="395" cy="282" r="6" fill="url(#goldAccent)"/>
    <line x1="400" y1="282" x2="435" y2="282" stroke="#FEF08A" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <line x1="398" y1="290" x2="425" y2="293" stroke="#FEF08A" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- Rear Tail Lights -->
    <rect x="110" y="275" width="5" height="22" rx="2" fill="#EF4444"/>

    <!-- AC Roof Unit / Luggage Rack Accent -->
    <rect x="190" y="128" width="130" height="12" rx="4" fill="#E2E8F0"/>
    <line x1="210" y1="134" x2="240" y2="134" stroke="#94A3B8" stroke-width="2"/>
    <line x1="260" y1="134" x2="290" y2="134" stroke="#94A3B8" stroke-width="2"/>

    <!-- Side Mirror -->
    <path d="M 400 180 Q 420 180 422 205 L 415 205 Q 412 188 398 188 Z" fill="#1E293B"/>

    <!-- Wheel Arches and Wheels -->
    <!-- Front Wheel -->
    <circle cx="340" cy="335" r="32" fill="#1E293B"/>
    <circle cx="340" cy="335" r="20" fill="#94A3B8"/>
    <circle cx="340" cy="335" r="10" fill="#F8FAFC"/>
    <circle cx="340" cy="335" r="5" fill="#047857"/>

    <!-- Rear Wheel -->
    <circle cx="170" cy="335" r="32" fill="#1E293B"/>
    <circle cx="170" cy="335" r="20" fill="#94A3B8"/>
    <circle cx="170" cy="335" r="10" fill="#F8FAFC"/>
    <circle cx="170" cy="335" r="5" fill="#047857"/>
  </g>
</svg>
