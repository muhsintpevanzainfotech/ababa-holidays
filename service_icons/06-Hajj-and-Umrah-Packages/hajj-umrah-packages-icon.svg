<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="hajjBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="50%" stop-color="#115E59"/>
      <stop offset="100%" stop-color="#134E4A"/>
    </linearGradient>
    <linearGradient id="goldKaaba" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="35%" stop-color="#FBBF24"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="kaabaBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#042F2E" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#hajjBg)" filter="url(#shadow)"/>

  <!-- Islamic Geometric Pattern Arc in Background -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>
  
  <!-- Majestic Mosque Minarets / Dome Silhouette in Background -->
  <g fill="#FFFFFF" fill-opacity="0.12">
    <!-- Left Minaret -->
    <rect x="85" y="160" width="18" height="180" rx="4"/>
    <path d="M 85 160 Q 94 135 103 160 Z"/>
    <circle cx="94" cy="130" r="3"/>
    
    <!-- Right Minaret -->
    <rect x="409" y="160" width="18" height="180" rx="4"/>
    <path d="M 409 160 Q 418 135 427 160 Z"/>
    <circle cx="418" cy="130" r="3"/>

    <!-- Central Grand Dome -->
    <path d="M 160 270 C 160 170 352 170 352 270 Z"/>
  </g>

  <!-- Crescent Moon and Islamic Star at Top -->
  <g transform="translate(256, 100)" fill="url(#goldKaaba)">
    <!-- Crescent Moon -->
    <path d="M -8 -30 A 28 28 0 1 0 28 6 A 22 22 0 1 1 -8 -30 Z"/>
    <!-- Star -->
    <polygon points="18,-18 20,-12 26,-12 21,-8 23,-2 18,-6 13,-2 15,-8 10,-12 16,-12" transform="scale(1.2)"/>
  </g>

  <!-- Holy Kaaba Sharif in Mecca (Centerpiece) -->
  <g transform="translate(0, 15)">
    <!-- Marble Floor Base Ring (Mataf) -->
    <ellipse cx="256" cy="380" rx="150" ry="40" fill="#FFFFFF" opacity="0.25"/>
    <ellipse cx="256" cy="380" rx="120" ry="30" fill="#FFFFFF" opacity="0.2"/>

    <!-- Kaaba Cube 3D Isometric View -->
    <!-- Left Side of Kaaba -->
    <polygon points="256,365 155,315 155,200 256,245" fill="url(#kaabaBlack)"/>
    <!-- Right Side of Kaaba -->
    <polygon points="256,365 357,315 357,200 256,245" fill="#020617"/>
    <!-- Top Roof of Kaaba -->
    <polygon points="256,245 155,200 256,155 357,200" fill="#334155"/>

    <!-- Gold Kiswah Calligraphy Belt (Hizam) -->
    <!-- Left Face Gold Belt -->
    <polygon points="256,268 155,223 155,208 256,253" fill="url(#goldKaaba)"/>
    <line x1="256" y1="260" x2="155" y2="215" stroke="#78350F" stroke-width="1.5" stroke-dasharray="4 3"/>

    <!-- Right Face Gold Belt -->
    <polygon points="256,268 357,223 357,208 256,253" fill="url(#goldKaaba)"/>
    <line x1="256" y1="260" x2="357" y2="215" stroke="#78350F" stroke-width="1.5" stroke-dasharray="4 3"/>

    <!-- Golden Door of Kaaba (Bab Al-Kaaba) on Left/Front Face -->
    <polygon points="228,260 205,250 205,320 228,332" fill="url(#goldKaaba)"/>
    <!-- Door Intricate Inscriptions -->
    <line x1="216" y1="255" x2="216" y2="326" stroke="#78350F" stroke-width="1.5"/>
    <rect x="207" y="265" width="8" height="12" fill="#78350F" opacity="0.3"/>
    <rect x="218" y="270" width="8" height="12" fill="#78350F" opacity="0.3"/>

    <!-- Golden Spout (Meezab Al-Rahmah) on Roof -->
    <line x1="205" y1="177" x2="195" y2="172" stroke="url(#goldKaaba)" stroke-width="4" stroke-linecap="round"/>

    <!-- Spiritual Golden Noor / Light Radiance at Base -->
    <ellipse cx="256" cy="365" rx="80" ry="12" fill="url(#goldKaaba)" opacity="0.4" filter="blur(6px)"/>
  </g>
</svg>
